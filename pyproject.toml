[project]
name = "kangaroo-benchmark"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "matplotlib>=3.10",
    "numpy>=1.26",
    "pandas>=2.2",
    "pillow>=10.3",
    "pyarrow>=16.0",
    "pytest>=8.3",
    "scipy>=1.16",
    "tqdm>=4.66",
]

[project.scripts]
reproduce-diagnostics = "analysis.diagnostics:main"
reproduce-surrogate = "analysis.surrogate_analysis:main"

[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["score_utils", "eval_run"]

[tool.setuptools.packages.find]
include = ["analysis*", "console*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
